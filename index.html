<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>デジタルブック</title>

  <!-- PDF一覧・サイト表示名の定義 -->
  <script src="books.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    :root {
      --bg-color: #f7f5f0;
      --card-bg: #ffffff;
      --text-main: #4a453e;
      --text-sub: #8c857b;
      --accent-color: #889887;
      --border-color: #e5e0d8;
      --shadow: 0 4px 12px rgba(70, 60, 50, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;

      background-color: var(--bg-color);
      color: var(--text-main);

      display: flex;
      flex-direction: column;

      /*
       * 100dvh:
       * スマホブラウザのアドレスバーなどを考慮した
       * 実際の表示領域を使いやすくする
       */
      height: 100dvh;

      overflow: hidden;
    }

    /* ========================================
       上部操作バー
       ======================================== */

    header {
      flex: 0 0 60px;
      height: 60px;

      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 24px;

      box-shadow: var(--shadow);

      z-index: 100;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-main);

      white-space: nowrap;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn {
      background-color: var(--bg-color);
      color: var(--text-main);

      border: 1px solid var(--border-color);

      padding: 8px 18px;
      border-radius: 20px;

      font-size: 13px;

      cursor: pointer;

      transition: all 0.2s ease;

      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover {
      background-color: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    .page-info {
      font-size: 14px;
      color: var(--text-sub);

      min-width: 60px;

      text-align: center;

      font-variant-numeric: tabular-nums;

      white-space: nowrap;
    }

    /* ========================================
       ブック表示領域
       ======================================== */

    main {
      flex: 1;

      width: 100%;
      min-width: 0;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;

      /*
       * 余白を極力なくす
       */
      padding: 0;

      overflow: hidden;

      /*
       * iPhone等のセーフエリア
       */
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    #book-container {
      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      visibility: hidden;

      overflow: hidden;

      position: relative;
    }

    /*
     * PageFlipの親
     */
    #book {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      /*
       * PageFlipが親要素のサイズを基準に
       * 描画できるようにする
       */
      transform-origin: center center;
    }

    .page {
      background-color: #ffffff;

      box-shadow:
        inset 0 0 10px rgba(0, 0, 0, 0.03);

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      /*
       * ページの縦横比を崩さない
       */
      contain: layout paint;
    }

    .page canvas {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;

      /*
       * Canvasのぼやけをできるだけ抑える
       */
      image-rendering: auto;
    }

    /* ========================================
       ローディング画面
       ======================================== */

    #loading {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      display: flex;

      flex-direction: column;
      align-items: center;

      gap: 16px;

      color: var(--text-sub);

      font-size: 14px;

      z-index: 200;

      text-align: center;

      white-space: nowrap;
    }

    .spinner {
      width: 36px;
      height: 36px;

      border: 3px solid var(--border-color);
      border-top: 3px solid var(--accent-color);

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* ========================================
       ハンバーガーメニュー
       ======================================== */

    .menu-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid var(--border-color);
      border-radius: 50%;
      background: var(--bg-color);
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .menu-btn span,
    .menu-btn span::before,
    .menu-btn span::after {
      display: block;
      width: 18px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      transition: transform 0.2s ease;
    }

    .menu-btn span {
      position: relative;
    }

    .menu-btn span::before,
    .menu-btn span::after {
      content: '';
      position: absolute;
      left: 0;
    }

    .menu-btn span::before {
      top: -6px;
    }

    .menu-btn span::after {
      top: 6px;
    }

    .menu-btn:hover {
      background-color: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    .menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.28);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      z-index: 500;
    }

    .menu-panel {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(320px, 86vw);
      background: var(--card-bg);
      border-right: 1px solid var(--border-color);
      box-shadow: 8px 0 24px rgba(70, 60, 50, 0.12);
      transform: translateX(-100%);
      transition: transform 0.22s ease;
      z-index: 600;
      display: flex;
      flex-direction: column;
    }

    body.menu-open .menu-overlay {
      opacity: 1;
      visibility: visible;
    }

    body.menu-open .menu-panel {
      transform: translateX(0);
    }

    .menu-header {
      min-height: 60px;
      padding: 0 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .menu-header-title {
      font-size: 15px;
      font-weight: 600;
    }

    .menu-close {
      border: 0;
      background: transparent;
      color: var(--text-sub);
      font-size: 28px;
      line-height: 1;
      padding: 4px 8px;
      cursor: pointer;
    }

    .book-list {
      list-style: none;
      overflow-y: auto;
      padding: 10px;
      margin: 0;
    }

    .book-list button {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text-main);
      text-align: left;
      padding: 14px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.5;
    }

    .book-list button:hover,
    .book-list button.active {
      background: var(--bg-color);
    }

    .book-list .book-file {
      display: block;
      margin-top: 3px;
      color: var(--text-sub);
      font-size: 11px;
      word-break: break-all;
    }

    /* ========================================
       スマホ
       ======================================== */

    @media (max-width: 600px) {
      header {
        flex-basis: 52px;
        height: 52px;

        padding: 0 10px;
      }

      .title {
        font-size: 13px;
      }

      .controls {
        gap: 6px;
      }

      .btn {
        padding: 7px 12px;
        font-size: 12px;
      }

      .page-info {
        font-size: 12px;
        min-width: 50px;
      }
    }

    /* ========================================
       非常に横幅の狭いスマホ
       ======================================== */

    @media (max-width: 380px) {
      .title {
        display: none;
      }

      header {
        justify-content: flex-end;
      }
    }
  </style>
</head>

<body>

  <!-- ========================================
       ヘッダー
       ======================================== -->

  <header>
    <button class="menu-btn" id="menu-btn" aria-label="PDFを選択" aria-expanded="false" aria-controls="menu-panel">
      <span></span>
    </button>

    <div class="title" id="site-title">冊子プレビュー</div>

    <div class="controls">
      <button class="btn" id="prev-btn">
        前へ
      </button>

      <span class="page-info" id="page-info">
        - / -
      </span>

      <button class="btn" id="next-btn">
        次へ
      </button>
    </div>
  </header>

  <div class="menu-overlay" id="menu-overlay"></div>

  <aside class="menu-panel" id="menu-panel" aria-hidden="true">
    <div class="menu-header">
      <div class="menu-header-title">冊子を選択</div>
      <button class="menu-close" id="menu-close" aria-label="メニューを閉じる">&times;</button>
    </div>
    <ul class="book-list" id="book-list"></ul>
  </aside>


  <!-- ========================================
       メイン
       ======================================== -->

  <main>

    <!-- ローディング -->
    <div id="loading">
      <div class="spinner"></div>
      <div>PDFを読み込んでいます...</div>
    </div>

    <!-- ブック -->
    <div id="book-container">
      <div id="book"></div>
    </div>

  </main>


  <script>
    /*
     * ========================================
     * PDF.js Worker
     * ========================================
     */

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';


    /*
     * ========================================
     * 初期化
     * ========================================
     */

    async function init() {

      const loadingEl = document.getElementById('loading');
      const containerEl = document.getElementById('book-container');
      const bookEl = document.getElementById('book');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const pageInfo = document.getElementById('page-info');
      const siteTitleEl = document.getElementById('site-title');
      const menuBtn = document.getElementById('menu-btn');
      const menuClose = document.getElementById('menu-close');
      const menuOverlay = document.getElementById('menu-overlay');
      const menuPanel = document.getElementById('menu-panel');
      const bookListEl = document.getElementById('book-list');

      let pageFlip = null;
      let resizeTimer = null;
      let currentBook = null;
      let currentTotalPages = 0;
      let currentPdfRatio = 0.707;
      let loadToken = 0;

      const books = Array.isArray(window.BOOKS) ? window.BOOKS : [];

      function openMenu() {
        document.body.classList.add('menu-open');
        menuBtn.setAttribute('aria-expanded', 'true');
        menuPanel.setAttribute('aria-hidden', 'false');
      }

      function closeMenu() {
        document.body.classList.remove('menu-open');
        menuBtn.setAttribute('aria-expanded', 'false');
        menuPanel.setAttribute('aria-hidden', 'true');
      }

      function renderBookMenu() {
        bookListEl.innerHTML = '';

        books.forEach((book) => {
          const li = document.createElement('li');
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.bookId = book.id;

          const title = document.createElement('span');
          title.textContent = book.name;

          const file = document.createElement('span');
          file.className = 'book-file';
          file.textContent = book.file;

          button.appendChild(title);
          button.appendChild(file);

          button.addEventListener('click', async () => {
            closeMenu();
            await loadBook(book);
          });

          li.appendChild(button);
          bookListEl.appendChild(li);
        });
      }

      function updateMenuActive() {
        bookListEl.querySelectorAll('button').forEach((button) => {
          button.classList.toggle(
            'active',
            currentBook && button.dataset.bookId === currentBook.id
          );
        });
      }

      function updatePageInfo() {
        if (!pageFlip || currentTotalPages <= 0) {
          pageInfo.textContent = '- / -';
          return;
        }

        const current = pageFlip.getCurrentPageIndex() + 1;
        pageInfo.textContent = `${current} / ${currentTotalPages}`;
      }

      function calculateBookSize() {
        const headerHeight = document
          .querySelector('header')
          .getBoundingClientRect()
          .height;

        const viewportWidth = window.innerWidth;
        const viewportHeight = window.visualViewport
          ? window.visualViewport.height
          : window.innerHeight;

        const availableWidth = Math.max(1, viewportWidth);
        const availableHeight = Math.max(1, viewportHeight - headerHeight);
        const margin = 5;

        const usableWidth = Math.max(1, availableWidth - margin * 2);
        const usableHeight = Math.max(1, availableHeight - margin * 2);

        let pageHeight = usableHeight;
        let pageWidth = pageHeight * currentPdfRatio;
        let spreadWidth = pageWidth * 2;

        if (spreadWidth > usableWidth) {
          spreadWidth = usableWidth;
          pageWidth = spreadWidth / 2;
          pageHeight = pageWidth / currentPdfRatio;
        }

        return {
          width: Math.max(100, Math.floor(pageWidth)),
          height: Math.max(100, Math.floor(pageHeight))
        };
      }

      function updateBookSize() {
        if (!pageFlip) return;

        const size = calculateBookSize();
        bookEl.style.width = `${size.width * 2}px`;
        bookEl.style.height = `${size.height}px`;
        pageFlip.update();
      }

      async function destroyCurrentBook() {
        if (pageFlip) {
          try {
            pageFlip.destroy();
          } catch (error) {
            console.warn('PageFlip destroy warning:', error);
          }
        }

        pageFlip = null;
        bookEl.innerHTML = '';
        bookEl.removeAttribute('style');
        currentTotalPages = 0;
        pageInfo.textContent = '- / -';
      }

      async function loadBook(book) {
        const thisLoadToken = ++loadToken;

        loadingEl.style.display = 'flex';
        loadingEl.innerHTML = `
    <div class="spinner"></div>
    <div>${book.name} を読み込んでいます...</div>
  `;

        containerEl.style.visibility = 'hidden';

        /*
         * 既存のPageFlipを完全に破棄
         */
        await destroyCurrentBook();

        try {
          /*
           * PDFファイルのURLを確実に解決
           *
           * 例：
           * sample2.pdf
           * ./sample2.pdf
           * pdf/sample2.pdf
           *
           * いずれも現在のHTMLを基準にした絶対URLになる
           */
          const pdfUrl = new URL(
            book.file,
            document.baseURI
          ).href;

          console.log('PDF loading:', {
            id: book.id,
            name: book.name,
            file: book.file,
            url: pdfUrl
          });

          /*
           * PDF.jsでPDFを読み込む
           */
          const pdf = await pdfjsLib.getDocument({
            url: pdfUrl,
            cMapUrl:
              'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
            cMapPacked: true
          }).promise;

          /*
           * 別のPDFへの切り替えが始まっていたら、
           * 今回の処理は中止
           */
          if (thisLoadToken !== loadToken) {
            return;
          }

          currentBook = book;
          currentTotalPages = pdf.numPages;

          /*
           * 1ページ目からPDFの縦横比を取得
           */
          const page1 = await pdf.getPage(1);

          if (thisLoadToken !== loadToken) {
            return;
          }

          const viewport1 = page1.getViewport({
            scale: 1
          });

          const pdfWidth = viewport1.width;
          const pdfHeight = viewport1.height;

          currentPdfRatio = pdfWidth / pdfHeight;

          /*
           * PDFをCanvasへ描画
           */
          const renderScale = 2;

          for (let i = 1; i <= currentTotalPages; i++) {

            if (thisLoadToken !== loadToken) {
              return;
            }

            const page = await pdf.getPage(i);

            if (thisLoadToken !== loadToken) {
              return;
            }

            const viewport = page.getViewport({
              scale: renderScale
            });

            const pageDiv = document.createElement('div');

            pageDiv.className = 'page';

            const canvas = document.createElement('canvas');

            const ctx = canvas.getContext(
              '2d',
              {
                alpha: false
              }
            );

            canvas.width = Math.floor(viewport.width);
            canvas.height = Math.floor(viewport.height);

            ctx.fillStyle = '#ffffff';

            ctx.fillRect(
              0,
              0,
              canvas.width,
              canvas.height
            );

            await page.render({
              canvasContext: ctx,
              viewport: viewport
            }).promise;

            if (thisLoadToken !== loadToken) {
              return;
            }

            pageDiv.appendChild(canvas);

            bookEl.appendChild(pageDiv);
          }

          /*
           * 最終確認
           */
          if (thisLoadToken !== loadToken) {
            return;
          }

          /*
           * PageFlipのサイズ計算
           */
          const initialSize = calculateBookSize();

          pageFlip = new St.PageFlip(
            bookEl,
            {
              width: initialSize.width,
              height: initialSize.height,

              size: 'stretch',

              minWidth: 100,
              minHeight: 100,

              maxWidth: 2000,
              maxHeight: 2000,

              usePortrait: false,

              showCover: true,

              mobileScrollSupport: false,

              maxShadowOpacity: 0.15,

              useMouseEvents: true,

              disableFlipByClick: false,

              flippingTime: 700,

              swipeDistance: 30
            }
          );

          /*
           * 現在生成したページだけをPageFlipへ渡す
           */
          const pages = bookEl.querySelectorAll('.page');

          pageFlip.loadFromHTML(pages);

          pageFlip.on(
            'flip',
            updatePageInfo
          );

          /*
           * 表示名を更新
           */
          siteTitleEl.textContent = book.name;

          document.title = book.name;

          /*
           * メニューの選択状態を更新
           */
          updateMenuActive();

          /*
           * 表示
           */
          loadingEl.style.display = 'none';

          containerEl.style.visibility = 'visible';

          /*
           * ページ情報更新
           */
          updatePageInfo();

          /*
           * サイズ更新
           */
          updateBookSize();

          updateMenuActive();

          console.log(
            'PDF loaded successfully:',
            pdfUrl
          );

        } catch (error) {

          console.error(
            'Error loading PDF:',
            error
          );

          if (thisLoadToken !== loadToken) {
            return;
          }

          /*
           * エラー時にも現在の冊子名を表示
           */
          currentBook = book;

          siteTitleEl.textContent = book.name;

          pageInfo.textContent = '- / -';

          /*
           * エラー内容を画面にも表示
           */
          const pdfUrl = new URL(
            book.file,
            document.baseURI
          ).href;

          loadingEl.innerHTML = `
      <div style="
        color:#a94442;
        white-space:normal;
        max-width:90vw;
        line-height:1.8;
      ">
        「${book.name}」のPDF読み込みに失敗しました。<br>
        ファイル名：${book.file}<br>
        URL：${pdfUrl}<br>
        <br>
        ブラウザのコンソールをご確認ください。
      </div>
    `;
        }
      }

      menuBtn.addEventListener('click', () => {
        if (document.body.classList.contains('menu-open')) {
          closeMenu();
        } else {
          openMenu();
        }
      });

      menuClose.addEventListener('click', closeMenu);
      menuOverlay.addEventListener('click', closeMenu);

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeMenu();
      });

      prevBtn.addEventListener('click', () => {
        if (pageFlip) pageFlip.flipPrev();
      });

      nextBtn.addEventListener('click', () => {
        if (pageFlip) pageFlip.flipNext();
      });

      function onResize() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(updateBookSize, 100);
      }

      window.addEventListener('resize', onResize);

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', onResize);
      }

      window.addEventListener('orientationchange', () => {
        setTimeout(updateBookSize, 300);
      });

      renderBookMenu();

      if (books.length === 0) {
        loadingEl.innerHTML = `
          <div style="color:#a94442; white-space:normal; max-width:90vw;">\n            books.js にPDFを登録してください。\n          </div>
        `;
        return;
      }

      await loadBook(books[0]);
    }

    /*
     * ========================================
     * DOM読み込み後に開始
     * ========================================
     */

    window.addEventListener(
      'DOMContentLoaded',
      init
    );

  </script>

</body>

</html>

<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>デジタルブック</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <script src="books.js"></script>

<style>
    :root {
      --bg-color: #f7f5f0;
      --card-bg: #ffffff;
      --text-main: #4a453e;
      --text-sub: #8c857b;
      --accent-color: #889887;
      --border-color: #e5e0d8;
      --shadow: 0 4px 12px rgba(70, 60, 50, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;

      background-color: var(--bg-color);
      color: var(--text-main);

      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* ========================================
       上部操作バー
       ======================================== */

    header {
      flex: 0 0 auto;
      min-height: 60px;
      /* スマホのノッチ（切り欠き）に被らないようにセーフエリアを確保 */
      padding-top: env(safe-area-inset-top);
      padding-left: max(24px, env(safe-area-inset-left));
      padding-right: max(24px, env(safe-area-inset-right));

      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1; /* 余白を埋める */
      min-width: 0; /* タイトルの省略表示（...）を機能させるために必須 */
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis; /* タイトルが長すぎる場合は「...」で省略 */
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0; /* ボタン群が潰れたり押し出されたりするのを防ぐ */
    }

    .btn {
      background-color: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap; /* テキストの折り返しを防ぐ */
    }

    .btn:hover {
      background-color: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    .btn-icon {
      padding: 8px;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .page-info {
      font-size: 14px;
      color: var(--text-sub);
      min-width: 60px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* ========================================
       メニュー（オーバーレイ）
       ======================================== */

    #menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(74, 69, 62, 0.6);
      z-index: 1000;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #menu-overlay.active {
      display: block;
      opacity: 1;
    }

    #menu-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 280px;
      height: 100%;
      background-color: var(--bg-color);
      box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    #menu-overlay.active #menu-content {
      transform: translateX(0);
    }

    .menu-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card-bg);
      flex: 0 0 auto;
    }

    .menu-header h3 {
      font-size: 15px;
      font-weight: 600;
    }

    #book-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }

    #book-list li {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    #book-list li:hover {
      background-color: #ebe7de;
    }

    #book-list li.active-book {
      background-color: var(--accent-color);
      color: #ffffff;
    }

    /* ========================================
       ブック表示領域
       ======================================== */

    main {
      flex: 1;
      width: 100%;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0;
      overflow: hidden;
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    #book-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      overflow: hidden;
      position: relative;
    }

    #book {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }

    .page {
      background-color: #ffffff;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      contain: layout paint;
    }

    .page canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: auto;
    }

    /* ========================================
       ローディング画面
       ======================================== */

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: var(--text-sub);
      font-size: 14px;
      z-index: 200;
      text-align: center;
      white-space: nowrap;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border-color);
      border-top: 3px solid var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* ========================================
       スマホ用調整
       ======================================== */

    @media (max-width: 600px) {
      header {
        min-height: 52px;
        padding-left: max(10px, env(safe-area-inset-left));
        padding-right: max(10px, env(safe-area-inset-right));
      }

      .title {
        font-size: 13px;
      }

      .controls {
        gap: 6px;
      }

      .btn {
        padding: 7px 10px; /* 少しパディングを減らして画面に収める */
        font-size: 12px;
      }

      .btn-icon {
        padding: 6px;
        width: 32px;
        height: 32px;
      }

      .page-info {
        font-size: 12px;
        min-width: 50px;
      }
    }

    /* ========================================
       非常に横幅の狭いスマホ
       ======================================== */

    @media (max-width: 380px) {
      .title {
        display: none;
      }

      header {
        justify-content: space-between;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-left">
      <button class="btn btn-icon" id="menu-btn" aria-label="メニュー">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="title" id="book-title">冊子プレビュー</div>
    </div>

    <div class="controls">
      <button class="btn" id="prev-btn">前へ</button>
      <span class="page-info" id="page-info">- / -</span>
      <button class="btn" id="next-btn">次へ</button>
    </div>
  </header>


  <div id="menu-overlay">
    <div id="menu-content">
      <div class="menu-header">
        <h3>冊子を選択</h3>
        <button class="btn btn-icon" id="menu-close-btn" aria-label="閉じる">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <ul id="book-list">
      </ul>
    </div>
  </div>


  <main>
    <div id="loading">
      <div class="spinner"></div>
      <div>PDFを読み込んでいます...</div>
    </div>

    <div id="book-container">
      <div id="book"></div>
    </div>
  </main>


  <script>
    /*
     * ========================================
     * PDF.js Worker
     * ========================================
     */
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    /*
     * グローバル状態管理
     */
    let pageFlip = null;
    let resizeTimer = null;
    let currentPdfRatio = 1;
    let totalPages = 0;
    let currentRenderId = 0;

    /*
     * DOM要素の取得
     */
    const loadingEl = document.getElementById('loading');
    const containerEl = document.getElementById('book-container');
    let bookEl = document.getElementById('book');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const pageInfo = document.getElementById('page-info');
    const bookTitleEl = document.getElementById('book-title');

    // メニュー関連
    const menuBtn = document.getElementById('menu-btn');
    const menuCloseBtn = document.getElementById('menu-close-btn');
    const menuOverlay = document.getElementById('menu-overlay');
    const bookList = document.getElementById('book-list');

    /*
     * ========================================
     * メニューの制御
     * ========================================
     */
    function toggleMenu(show) {
      if (show) {
        menuOverlay.style.display = 'block';
        // 描画を待ってからクラス付与（アニメーション用）
        requestAnimationFrame(() => {
          menuOverlay.classList.add('active');
        });
      } else {
        menuOverlay.classList.remove('active');
        // トランジション完了後に非表示
        setTimeout(() => {
          if (!menuOverlay.classList.contains('active')) {
            menuOverlay.style.display = 'none';
          }
        }, 300);
      }
    }

    menuBtn.addEventListener('click', () => toggleMenu(true));
    menuCloseBtn.addEventListener('click', () => toggleMenu(false));
    menuOverlay.addEventListener('click', (e) => {
      if (e.target === menuOverlay) toggleMenu(false);
    });

    /*
     * リストの初期化
     */
    function buildMenu(activeBookId) {
      bookList.innerHTML = '';
      if (!window.BOOKS) return;

      window.BOOKS.forEach(book => {
        const li = document.createElement('li');
        li.textContent = book.name;

        if (book.id === activeBookId) {
          li.classList.add('active-book');
        }

        li.addEventListener('click', () => {
          toggleMenu(false);
          if (book.id !== activeBookId) {
            initViewer(book.id);
          }
        });
        bookList.appendChild(li);
      });
    }

    /*
     * ========================================
     * サイズ計算・更新処理
     * ========================================
     */
    function calculateBookSize() {
      const headerHeight = document.querySelector('header').getBoundingClientRect().height;
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.visualViewport
        ? window.visualViewport.height
        : window.innerHeight;

      const availableWidth = Math.max(1, viewportWidth);
      const availableHeight = Math.max(1, viewportHeight - headerHeight);

      const margin = 5;
      const usableWidth = Math.max(1, availableWidth - margin * 2);
      const usableHeight = Math.max(1, availableHeight - margin * 2);

      let pageHeight = usableHeight;
      let pageWidth = pageHeight * currentPdfRatio;
      let spreadWidth = pageWidth * 2;

      if (spreadWidth > usableWidth) {
        spreadWidth = usableWidth;
        pageWidth = spreadWidth / 2;
        pageHeight = pageWidth / currentPdfRatio;
      }

      return {
        width: Math.floor(pageWidth),
        height: Math.floor(pageHeight)
      };
    }

    function updateBookSize() {
      if (!pageFlip) return;
      const size = calculateBookSize();
      bookEl.style.width = `${size.width * 2}px`;
      bookEl.style.height = `${size.height}px`;
      pageFlip.update();
    }

    function updatePageInfo() {
      if (!pageFlip) return;
      const current = pageFlip.getCurrentPageIndex() + 1;
      pageInfo.textContent = `${current} / ${totalPages}`;
    }

    /*
     * ========================================
     * PDF初期化・再読み込み (メインロジック)
     * ========================================
     */
    async function initViewer(bookId) {
      // 処理のIDを更新し、現在のIDを保持
      const renderId = ++currentRenderId;

      // 既存のPageFlipインスタンスがあれば破棄
      if (pageFlip) {
        pageFlip.destroy();
        pageFlip = null;
      }

      // bookEl自体を作り直すことで、PageFlipの不要な状態やスタイルを完全にリセット
      containerEl.innerHTML = '<div id="book"></div>';
      bookEl = document.getElementById('book');
      containerEl.style.visibility = 'hidden';
      loadingEl.style.display = 'flex';
      pageInfo.textContent = '- / -';

      // 該当の冊子情報を取得
      const bookInfo = window.BOOKS.find(b => b.id === bookId) || window.BOOKS[0];

      // タイトルとメニューを更新
      bookTitleEl.textContent = bookInfo.name;
      buildMenu(bookInfo.id);

      try {
        /*
         * PDFの読み込み
         */
        const pdf = await pdfjsLib.getDocument({ url: bookInfo.file }).promise;
        totalPages = pdf.numPages;

        // 別の冊子がクリックされてIDが変わっていたら処理を中断
        if (renderId !== currentRenderId) return;

        /*
         * 1ページ目から縦横比を取得
         */
        const page1 = await pdf.getPage(1);
        const viewport1 = page1.getViewport({ scale: 1 });
        currentPdfRatio = viewport1.width / viewport1.height;

        /*
         * 全ページをCanvasに描画
         */
        const renderScale = 2;

        for (let i = 1; i <= totalPages; i++) {
          // ループ内でもチェックを入れるとより安全
          if (renderId !== currentRenderId) return;
          const page = await pdf.getPage(i);
          const viewport = page.getViewport({ scale: renderScale });

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';

          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d', { alpha: false });

          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);

          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          await page.render({
            canvasContext: ctx,
            viewport: viewport
          }).promise;

          pageDiv.appendChild(canvas);
          bookEl.appendChild(pageDiv);
        }

        /*
                 * PageFlip初期化
                 */
        const initialSize = calculateBookSize();

        // ★修正：PageFlipを生成する前に、親の #book 要素に見開き幅と高さを設定する
        bookEl.style.width = `${initialSize.width * 2}px`;
        bookEl.style.height = `${initialSize.height}px`;

        pageFlip = new St.PageFlip(bookEl, {
          width: initialSize.width,
          height: initialSize.height,
          size: 'stretch',
          minWidth: 100,
          minHeight: 100,
          maxWidth: 2000,
          maxHeight: 2000,
          usePortrait: false,
          showCover: true,
          mobileScrollSupport: false,
          maxShadowOpacity: 0.15,
          useMouseEvents: true,
          disableFlipByClick: false,
          flippingTime: 700,
          swipeDistance: 30
        });

        // 描画された .page 要素が確実にDOMに存在することを確認してからロード
        const pageElements = bookEl.querySelectorAll('.page');
        if (pageElements.length > 0) {
          pageFlip.loadFromHTML(pageElements);
        } else {
          throw new Error('ページ要素が生成されていません');
        }

        /*
         * ページめくりイベント登録
         */
        pageFlip.on('flip', updatePageInfo);

        /*
         * 表示の更新
         */
        loadingEl.style.display = 'none';
        containerEl.style.visibility = 'visible';

        updatePageInfo();
        updateBookSize();

      } catch (error) {
        console.error('Error loading PDF:', error);
        loadingEl.innerHTML = `
          <div style="color:#a94442;">
            PDFの描画に失敗しました。<br>
            コンソールエラーをご確認ください。
          </div>
        `;
      }
    }

    /*
     * ========================================
     * イベントリスナーの登録（一度だけ実行）
     * ========================================
     */
    prevBtn.addEventListener('click', () => {
      if (pageFlip) pageFlip.flipPrev();
    });

    nextBtn.addEventListener('click', () => {
      if (pageFlip) pageFlip.flipNext();
    });

    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => updateBookSize(), 100);
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => updateBookSize(), 100);
      });
    }

    window.addEventListener('orientationchange', () => {
      setTimeout(() => updateBookSize(), 300);
    });

    /*
     * ========================================
     * DOM読み込み後に最初の冊子をロード
     * ========================================
     */
    window.addEventListener('DOMContentLoaded', () => {
      if (window.BOOKS && window.BOOKS.length > 0) {
        initViewer(window.BOOKS[0].id);
      } else {
        loadingEl.innerHTML = '冊子データが見つかりません (books.js を確認してください)';
      }
    });

  </script>
</body>

</html>
